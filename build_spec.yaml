version: 0.1
component: build
timeoutInSeconds: 1200
runAs: root
shell: bash
failImmediatelyOnError: true

env:
  exportedVariables:
    - BUILDRUN_HASH

steps:
  - type: Command
    name: "Define build tag"
    command: |
      set -euo pipefail

      if [ -n "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-}" ]; then
        BUILDRUN_HASH="$(echo "$OCI_PRIMARY_SOURCE_COMMIT_HASH" | cut -c1-7)"
      elif [ -n "${OCI_TRIGGER_COMMIT_HASH:-}" ]; then
        BUILDRUN_HASH="$(echo "$OCI_TRIGGER_COMMIT_HASH" | cut -c1-7)"
      else
        BUILDRUN_HASH="$(echo "$OCI_BUILD_RUN_ID" | cut -c1-7)"
      fi

      export BUILDRUN_HASH
      echo "BUILDRUN_HASH=$BUILDRUN_HASH"

  - type: Command
    name: "Build Spring Boot JAR"
    command: |
      set -euo pipefail
      cd MtdrSpring/backend

      echo "Current directory:"
      pwd

      echo "Listing backend files:"
      ls -la

      if [ -f "./mvnw" ]; then
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests
      else
        mvn clean package -DskipTests
      fi

      echo "Listing target files:"
      ls -lah target

  - type: Command
    name: "Build Docker image"
    command: |
      set -euo pipefail
      cd MtdrSpring/backend
      docker build -t todolistapp-springboot:latest .

  - type: Command
    name: "Prepare Kubernetes manifest"
    command: |
      set -euo pipefail
      cp MtdrSpring/backend/src/main/resources/todolistapp-springboot.yaml todolistapp-springboot.yaml
      echo "Prepared manifest:"
      cat todolistapp-springboot.yaml

outputArtifacts:
  - name: octotask-image
    type: DOCKER_IMAGE
    location: todolistapp-springboot:latest

  - name: octotask-oke-manifest
    type: BINARY
    location: todolistapp-springboot.yaml