name: Dev CI

on:
  push:
    branches:
      - "feature/*"

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: build-package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MtdrSpring/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build backend, frontend, and Spring Boot jar
        run: ./mvnw -B clean package spring-boot:repackage

      - name: Verify generated jar exists
        run: test -f target/MyTodoList-0.0.1-SNAPSHOT.jar

      - name: Upload packaged jar
        uses: actions/upload-artifact@v4
        with:
          name: octotask-springboot-jar
          path: MtdrSpring/backend/target/MyTodoList-0.0.1-SNAPSHOT.jar

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: build-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged jar
        uses: actions/download-artifact@v4
        with:
          name: octotask-springboot-jar
          path: MtdrSpring/backend/target

      - name: Build Docker image without pushing
        run: docker build -f MtdrSpring/backend/Dockerfile -t octotask-ci:${{ github.sha }} MtdrSpring/backend