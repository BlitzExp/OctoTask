# Local dev — in-memory H2, no Oracle wallet required.
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.datasource.url=jdbc:h2:mem:octotask;DB_CLOSE_DELAY=-1;MODE=Oracle;DATABASE_TO_LOWER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql
spring.sql.init.data-locations=classpath:data-local.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
