apiVersion: v1
kind: Service
metadata:
  name: todolistapp-springboot-service
  annotations:
    oci.oraclecloud.com/loadbalancer-policy: "IP_HASH"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: todolistapp-springboot
---
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-backend-router
spec:
  selector:
    app: todolistapp-springboot
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolistapp-springboot
  template:
    metadata:
      labels:
        app: todolistapp-springboot
        version: v1
      annotations:
        octotask/build: "${BUILDRUN_HASH}"
    spec:
      containers:
        - name: todolistapp-springboot
          image: mx-queretaro-1.ocir.io/axazeziwzv4z/octotask/nl6on/todolistapp-springboot:${BUILDRUN_HASH}
          imagePullPolicy: Always

          envFrom:
            - secretRef:
                name: todolistapp-env
                optional: true

          env:
            - name: driver_class_name
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: DRIVER_CLASS_NAME
                  optional: true

            - name: db_user
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: DB_USER
                  optional: true

            - name: dbpassword
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: DB_PASSWORD
                  optional: true

            - name: db_url
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: DB_URL
                  optional: true

            - name: todo.table.name
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: TODO_TABLE_NAME
                  optional: true

            - name: ui_username
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: UI_USERNAME
                  optional: true

            - name: ui_password
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: UI_PASSWORD
                  optional: true

            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: TELEGRAM_BOT_TOKEN
                  optional: true

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todolistapp-env
                  key: GEMINI_API_KEY
                  optional: true

          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
              readOnly: true

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

      restartPolicy: Always

      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot