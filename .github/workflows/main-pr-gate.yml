name: Main PR Gate

on:
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  main-pr-gate:
    name: main-pr-gate
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source and creator
        run: |
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"
          echo "Head repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "PR author: ${{ github.event.pull_request.user.login }}"

          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "This PR does not target main."
            exit 1
          fi

          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "PRs to main must come from this repository, not a fork."
            exit 1
          fi

          if [ "${{ github.event.pull_request.user.login }}" = "github-actions[bot]" ] && [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "Automated promotion PRs into main must use the dev branch."
            exit 1
          fi

          if [ "${{ github.event.pull_request.head.ref }}" = "dev" ] && [ "${{ github.event.pull_request.user.login }}" != "github-actions[bot]" ]; then
            echo "PRs from dev to main must be created by the automated Promote Dev to Main workflow."
            exit 1
          fi

          echo "Valid PR source for main."
