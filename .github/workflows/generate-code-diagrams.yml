name: Generate Code Diagrams

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/diagrams/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-diagrams:
    name: Generate PlantUML diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: MtdrSpring/backend
        run: chmod +x ./mvnw

      - name: Generate PlantUML source diagrams
        working-directory: MtdrSpring/backend
        run: ./mvnw -Puml -DskipTests generate-test-sources

      - name: Render PlantUML diagrams to SVG
        uses: grassedge/generate-plantuml-action@v1.5
        with:
          path: docs/diagrams
          message: "Render PlantUML diagrams"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated diagrams
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update generated PlantUML diagrams"
          file_pattern: docs/diagrams/*.puml docs/diagrams/*.svg